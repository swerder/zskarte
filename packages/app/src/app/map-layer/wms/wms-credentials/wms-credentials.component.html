<div mat-dialog-title>{{ i18n.get('wmsCredentials') }}</div>
<div mat-dialog-content>
    <div>{{wmsSourceUrl}}</div>
    <div>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>{{ i18n.get('user') }}</mat-label>
          <input matInput type="text" [(ngModel)]="credentials.user" />
        </mat-form-field>
    </div>
    <div>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>{{ i18n.get('password') }}</mat-label>
          <input matInput type="password" [(ngModel)]="credentials.password" />
        </mat-form-field>
    </div>
</div>
<div mat-dialog-actions align="end">
  <button mat-stroked-button [mat-dialog-close]="true" (click)="cancel()" [innerText]="i18n.get('cancel')"></button>
  <button
    mat-flat-button
    color="primary"
    [mat-dialog-close]="true"
    cdkFocusInitial
    (click)="ok()"
    [innerText]="i18n.get('confirm')"
  ></button>
</div>
